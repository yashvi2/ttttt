own wedding. You'll get there.`,`Nobody here has seen the Statue of Liberty up close. It's a point of pride.`,`The bodega cat outranks the bodega owner. Remember that.`],sister:{low:`Your sister? The musician? You talk about her a lot. It's sweet. Gross, but sweet.`,high:`Honestly, you two sound like the same person split in half and posted to different countries.`},clues:[{id:`a3`,minPhase:2,minRel:1,lines:[`Oh! A package came for you. No stamp, no postmark. Someone just… left it at the door.`,`It's a sprig of dried heather. Purple. Smells like wind. That mean anything to you?`]}],meal:`Dev tells you about recording a celery stalk snapping for a "bone crunch" sound. You never eat celery again.`,deep:{3:`I moved here from Edison, New Jersey, which is technically forty minutes away and emotionally another planet. I get the homesick thing.`,5:`For the record: best roommate I've had. The last one kept a snake. It was also named Dev. It was confusing.`},perk:{rel:4,id:`bike`,name:`Citi Bike membership`,desc:`Dev gives you his spare bike-share key. Sprint speed +30%.`}},{id:`rosa`,name:`Rosa Bellini`,role:`Owns Rosa's Slice since 1987`,look:{skin:14197886,hair:10132122,hairStyle:`bun`,top:16777215,bottom:2763306,coat:null,scarf:11735582},schedule:[{from:11,to:26,district:`brooklyn`,cell:[1,0],side:`n`,t:-.4}],intro:[`You're the photographer with the Raman boy. Sit. You're too skinny. Here, take a napkin, take two.`],lines:{1:[`You fold the slice. You never use a fork. I don't care where you're from, in here we fold.`],2:[`My husband, God rest him, proposed on the Brooklyn Bridge. In the rain. He was an idiot. I miss him every day.`,`Fifty years this neighborhood changes. Pizza — pizza doesn't change.`],3:[`You're asking a lot of questions for somebody who hasn't finished their crust.`],4:[`Go get her, sweetheart. Then bring her here. I'll make a pie with both your names on it.`]},city:[`Brooklyn is not Manhattan. Manhattan is where you work. Brooklyn is where you live.`,`Tourists ask for ranch dressing. I pretend I don't speak English.`],sister:{low:`A sister, eh? I had four. Don't get me started.`,high:`Sisters fight, sisters make up. It's the law.`},clues:[{id:`b1`,minPhase:3,minRel:1,lines:[`Funny. There's a girl comes in every night at eleven. Plain slice. Accent like the BBC.`,`Last week she asks me the way back to Kent Avenue. I say "sweetheart, you're on it". She laughs like you. Exactly like you.`]}],meal:`Rosa sits with you, which she never does. She tells you about 1987. The story involves a Vespa and a priest.`,deep:{3:`You come every night now. Good. A city is just a lot of strangers until you have a place that knows your order.`}},{id:`marguerite`,name:`Marguerite Okafor`,role:`Residency mentor · photographer`,look:{skin:5913124,hair:14211288,hairStyle:`short`,top:1907997,bottom:1907997,coat:6957610,scarf:14725184,accessory:`camera`},schedule:[{from:9,to:18,district:`midtown`,cell:[-1,0],side:`e`},{from:18,to:22,district:`village`,cell:[2,-1],side:`w`}],intro:[`Emma Hart. Your portfolio had a photograph of a stone bridge at dusk. I said yes to this residency because of that one frame.`,`Here, we don't take pictures of New York. We take pictures of what New York does to people. Start walking.`],lines:{1:[`First week, just look. The city will try to show off. Ignore the skyline. Watch the hands.`],2:[`Your contact sheets are getting braver. You're closer to people now. Good.`,`Light in this city bounces off glass. Golden hour happens twice — once in the sky, once in the windows.`],3:[`You're distracted. That's fine. Distraction is just attention pointing somewhere new.`],4:[`Whatever you're chasing, bring your camera. Some moments you'll want to prove happened.`]},city:[`Everybody here is from somewhere else. That's what makes it New York.`,`I came from Lagos in 1979 with one lens and a coat that was wrong for February.`],sister:{low:`You mentioned a sister. Musicians and photographers — both of you trying to hold still something that moves.`,high:`Photograph her when you see her. Not posed. The second after she laughs.`},clues:[{id:`d1`,minPhase:3,minRel:2,requires:[`stay`,`routine`],lines:[`Odd thing. I got an email from a young musician. English. Very polite.`,`She asked which of your photographs you were proudest of. I told her: the bridge at dusk. She wrote back one word — "perfect".`]}],meal:`Over coffee, Marguerite shows you contact sheets from 1983. Every frame is someone mid-laugh.`,deep:{3:`You have an eye for the moment before something happens. That's rare. Protect it.`,5:`When the residency ends, I'd like to show your work. A small wall. A real one.`},perk:{rel:4,id:`rooftop`,name:`Studio roof access`,desc:`Marguerite gives you the roof key. New photo spot: Midtown at Golden Hour.`}},{id:`jaylen`,name:`Jaylen Brooks`,role:`Fellow resident · street photographer`,look:{skin:5913126,hair:1314828,hairStyle:`short`,top:14707242,bottom:2767450,cap:1776411,accessory:`camera`},schedule:[{from:9,to:17,district:`midtown`,cell:[-1,0],side:`e`,t:.3},{from:17,to:24,district:`midtown`,at:[8,-30]}],intro:[`Yo, the new resident! Jaylen. I shoot Times Square because everyone says you can't. Watch me.`],lines:{1:[`Rule one: never stop walking when you shoot. Rule two: I made up rule one.`],2:[`Saw your Bow Bridge frames. Clean. Too clean. Get dirt on them.`,`I follow like four hundred musicians on Insta. Best light, weirdest hours.`],3:[`You're on a mission. I can tell. You've stopped photographing pigeons.`],4:[`Go! I'll caption it later.`]},city:[`Times Square at 3am is the most honest place in America.`,`The trick in New York is looking up. Everyone else is looking at their phone.`],sister:{low:`Your sister plays music? What kind? Send me her page, I'll lurk.`,high:`I feel like I've met her. You do her laugh sometimes without noticing.`},clues:[{id:`a4`,minPhase:2,minRel:1,lines:[`Wait — is your sister @softlanterns? I follow her. Look at this story from last night.`,`Guitar case in the foreground. And reflected in the latch… that's a yellow cab. That's not London, Em.`]}],meal:`Jaylen eats a slice while walking and somehow photographs a wedding party mid-bite. Legend.`,deep:{3:`My grandma took the train up from Georgia in '62 with a Brownie camera. I shoot for her.`}},{id:`luis`,name:`Luis Ortega`,role:`Coffee cart · Washington Square`,look:{skin:11565650,hair:2760212,hairStyle:`short`,top:2775690,bottom:3815994,cap:2775690},schedule:[{from:6,to:15,district:`village`,at:[16,-18]},{from:15,to:20,district:`village`,at:[-8,18]}],intro:[`Good morning, good morning! First coffee is on Luis. Second coffee is two dollars. Third coffee, we're family.`],lines:{1:[`Twenty-two years on this corner. I have seen NYU students become lawyers and lawyers become poets.`],2:[`The chess guys over there? Hustlers. Beautiful hustlers. Never play the one with the hat.`],3:[`You got the look of someone searching. Coffee helps searching.`],4:[`Run, run! The coffee will wait. Luis always waits.`]},city:[`In New York, "regular coffee" means milk and two sugars. In London they put milk in tea. Everybody's crazy.`,`The piano guy drags a whole grand piano into the square. Every day. Nobody asks how.`],sister:{low:`Sister? Tell her Luis says hello. Luis says hello to everybody's sister.`,high:`You smile different when you talk about her.`},clues:[{id:`a2`,minPhase:2,minRel:1,lines:[`Ha, you know what happened last week? A girl, English accent, asks me for "a proper builder's tea".`,`I give her a tea bag in hot water. She looks at me like I insulted her grandmother. Then she tips five dollars. Five!`]}],meal:`Luis refuses your money. You leave it in his tip jar. He puts it back in your pocket. This goes on for a while.`,deep:{3:`My daughter lives in Madrid now. We video call every Sunday. Distance is just a long hallway.`}},{id:`theo`,name:`Theo Marsh`,role:`Jazz bassist · The Blue Lantern`,romance:!0,look:{skin:13145194,hair:2759184,hairStyle:`short`,top:2042426,bottom:1907997,coat:3815994,scarf:6957610},schedule:[{from:11,to:17,district:`village`,cell:[-1,-1],side:`e`},{from:18,to:26,district:`village`,cell:[1,0],side:`w`}],intro:[`Hey. You were in the front at the Lantern last night — you were the only one not on your phone. I'm Theo. I play the big violin.`],lines:{1:[`Jazz is just people agreeing to listen to each other very carefully. Photography's the same, right?`],2:[`I've got a set Thursday. You should come. Bring your camera, or don't — sometimes it's better to just be there.`,`You have an overexposed coffee stain on your sleeve. Very artistic.`],3:[`You've been asking around. The Village talks, you know. We're a small town with tall buildings.`],4:[`Whatever this is — I hope you find it. And then I hope you tell me about it over dinner.`]},city:[`The Village is the only part of Manhattan where the streets forgot the grid. Get lost on purpose.`,`Every bar here claims Bob Dylan played there once. Most of them are right.`],sister:{low:`A musician sister, huh? What does she play?`,high:`If she's anything like you, she's probably playing somewhere right now pretending not to be nervous.`},clues:[{id:`c2`,minPhase:3,minRel:2,lines:[`Okay, I'm not supposed to say this. There's a guitarist from London who sits in with us Thursday and Sunday nights.`,`Red hair. Plays like she's telling you a secret. She made the whole band promise not to tell "the photographer". I'm… a bad promiser.`]}],meal:`Theo explains the difference between bebop and hard bop using salt shakers. You understand none of it and enjoy all of it.`,deep:{3:`I grew up in Ohio listening to my dad's records. New York was the city on every album cover.`,5:`I don't know what happens when your residency ends. But I'm glad you walked into the Lantern.`},perk:{rel:4,id:`reservation`,name:`Dinner reservation`,desc:`Theo booked a table at Olive & Vine. New location unlocked in the Village (evenings).`},date:[`Candles, a tiny table, a waiter who recites the specials like poetry.`,`Theo: "So — what's the photograph you haven't taken yet?"`,`You tell him about a bridge back home, at dusk, and a girl with a guitar case sitting on the railing.`,`He doesn't say anything clever. He just listens. It's better.`]},{id:`hana`,name:`Hana Kim`,role:`Gallery assistant · Gallery 9`,look:{skin:15254688,hair:1314828,hairStyle:`bob`,top:15921906,bottom:1907997,coat:10127992},schedule:[{from:11,to:20,district:`village`,cell:[2,-1],side:`w`,t:.3}],intro:[`Welcome to Gallery 9. The art is on the walls, the free wine is at the back, and the artist is the one pretending not to watch you.`],lines:{1:[`We're between shows. Currently exhibiting: a fire extinguisher. Very conceptual.`],2:[`Marguerite Okafor is your mentor? She's a legend. She once made a critic cry with a single contact sheet.`],3:[`People think galleries are quiet. They're not. Everyone gossips. Constantly.`],4:[`Go on. I'll hold your coat. Metaphorically.`]},city:[`Rent in the East Village is a crime. The dumplings are the alibi.`,`Every artist here has a day job. Mine is being an artist. My night job is also being an artist. I'm tired.`],sister:{low:`Is she coming to visit? We could do a pop-up. Photography and live music. Very 2026.`,high:`I have a sister in Seoul. We text memes at each other across fourteen time zones. It counts.`},clues:[{id:`b2`,minPhase:3,minRel:2,lines:[`Weird coincidence. Someone booked our back room for rehearsals. Name on the form: "S. Hart".`,`Address was a hostel on Kent Avenue, Williamsburg. Hart — that's your surname, isn't it?`]}],meal:`Hana draws your portrait on a napkin while you eat. It is unflattering and perfect.`,deep:{3:`I curate shows about people leaving home. Turns out I'm always curating my own homesickness.`}},{id:`bea`,name:`Bea Lindqvist`,role:`Dog walker · Central Park regular`,look:{skin:15845797,hair:14201706,hairStyle:`long`,top:3828298,bottom:3815994,coat:13208122,cap:2771562},schedule:[{from:7,to:12,district:`centralpark`,at:[8,14]},{from:12,to:18,district:`centralpark`,at:[-36,34]}],intro:[`Hi! Sorry — that's Biscuit, and Pickle, and the big one is Sir Reginald. They're all very friendly except Sir Reginald, who is just very large.`],lines:{1:[`I walk eleven dogs a day. I know every tree in this park personally. Some of them are my enemies.`],2:[`Bethesda in the morning is the best. Musicians come to practise under the arcade because the echo makes them sound famous.`],3:[`You're here early again. Looking for someone?`],4:[`Go go go! Sir Reginald believes in you.`]},city:[`Central Park is fake. Every rock, every lake — designed. The most natural thing in New York is a lie. I love it.`,`Squirrels here have seen things. Don't make eye contact.`],sister:{low:`I'm an only child. I have eleven dogs instead. It's similar.`,high:`Tell her to come walk with us! Biscuit loves new people. Pickle tolerates them.`},clues:[{id:`c1`,minPhase:3,minRel:1,song:!0,lines:[`Oh! There's this redhead who busks at Bethesda at nine every morning. Guitar. English.`,`She plays this one tune over and over — it goes, um… (Bea hums. It's Paper Lanterns. It's YOUR song.)`]}],meal:`You share a pretzel with Bea while three dogs stare at you like you owe them money.`,deep:{3:`I moved here after a breakup. The dogs didn't care about any of it. That helped.`}},{id:`ruth`,name:`Ruth Abernathy`,role:`Museum docent · 31 years`,look:{skin:9067066,hair:12303291,hairStyle:`bun`,top:6957642,bottom:2763306,coat:2763322,scarf:14725184},schedule:[{from:10,to:17.5,district:`uws`,at:[8,-32]}],intro:[`Welcome! Are you here for the dinosaurs, the whale or existential dread? We have all three, second floor.`],lines:{1:[`The blue whale is ninety-four feet long. Fibreglass. Children think it's real. So do some adults. I don't correct them.`],2:[`People come back to the museum at different ages and see different things. The whale doesn't change. We do.`],3:[`You look like a woman on the trail of something. Very Agatha Christie. I approve.`],4:[`Off you go, detective.`]},city:[`The Upper West Side is where New Yorkers go to become their grandparents. I say that with love.`,`Everyone on this block has an opinion about bagels, and every opinion is wrong except mine.`],sister:{low:`Did you two come to museums as children? You have the look of someone who lay on the floor under the whale.`,high:`Sisters remember the same childhood differently. That's the fun of it.`},clues:[{id:`c3`,minPhase:3,minRel:1,lines:[`You'll like this. Someone left a drawing in our guestbook by the whale. Paper lanterns — dozens of them.`,`Signed: "S. — you always loved the whale." Dated this week. Ring any bells, dear?`]}],meal:`Ruth tells you about 1985, when a meteorite went missing for a day. "It turned up in the gift shop. Long story."`,deep:{3:`My sister and I didn't speak for nine years over a casserole dish. Don't waste nine years. Casseroles are replaceable.`}},{id:`ezra`,name:`Ezra Feld`,role:`Bookseller · Riverside Books`,look:{skin:15517864,hair:7031338,hairStyle:`short`,top:8022608,bottom:2767450,coat:null,scarf:2771562},schedule:[{from:10,to:21,district:`uws`,cell:[1,0],side:`w`,t:.3}],intro:[`Oh, hi. Sorry, I was reading. I'm always reading. It's a bookstore, it's allowed. I'm Ezra.`],lines:{1:[`My grandfather opened this shop in 1961. The ceiling fan has also been here since 1961. It has opinions.`],2:[`If you want to understand New York, read about its bridges. Every bridge here is somebody's love story.`],3:[`You've been in three times this week. Either you love books or you're investigating something.`],4:[`Go! Books will still be here. That's the point of books.`]},city:[`The subway smells like history and also like something else. Mostly the something else.`,`New Yorkers hate tourists and give them directions anyway. Very complicated relationship.`],sister:{low:`Your sister reads? Tell her the poetry section is where the good stuff hides.`,high:`Bring her by. I'll recommend her something she'll pretend not to cry at.`},clues:[{id:`c4`,minPhase:3,minRel:1,lines:[`There's an English girl who buys staff paper here every afternoon. Music paper. We're the only shop that stocks it.`,`She asked me for books on the Brooklyn Bridge. Said her sister "has a thing about bridges at dusk".`]},{id:`d4`,minPhase:3,minRel:2,requires:[`routine`],lines:[`She came back. Bought an old map of the city from 1920. Circled one thing in red pencil before she left.`,`The Brooklyn Bridge. And next to it, in tiny letters: "sunset".`]}],meal:`Ezra reads you the first page of his favourite novel over coffee. He does all the voices.`,deep:{3:`I've never left New York. Not once. Your life sounds like one of my books.`}}],deductions:[{id:`where`,q:`Where is Sophie, really?`,need:3,clues:[`a1`,`a2`,`a3`,`a4`,`a5`],phase:2,options:[{text:`Still in London — just busy with rehearsals`,wrong:`London time is five hours ahead. Her 3am posts, her tea, the yellow cab… it doesn't add up.`},{text:`Here — in New York, in secret`,correct:!0},{text:`On tour in Paris`,wrong:`Sophie cannot speak French. She once ordered "a grapefruit of the house". Not Paris.`}],reveal:`She's here. Sophie is somewhere in this city. And she doesn't want you to know — yet.`},{id:`stay`,q:`Where is she staying?`,need:3,clues:[`b1`,`b2`,`b3`,`b4`],phase:3,options:[{text:`A hotel in Times Square`,wrong:`On an internship stipend? Sophie once walked two miles to save a bus fare.`},{text:`On Dev's couch — he's in on it`,wrong:`Dev cannot keep a secret about a sandwich. You'd know.`},{text:`A hostel on Kent Avenue, Williamsburg`,correct:!0}],reveal:`Kent Avenue. She's been ten minutes from your front door the whole time.`},{id:`routine`,q:`What does her day look like?`,need:3,clues:[`c1`,`c2`,`c3`,`c4`],phase:3,options:[{text:`Mornings busking at Bethesda, nights playing at the Blue Lantern`,correct:!0},{text:`Working the till at a Midtown café`,wrong:`Sophie was fired from a café for "excessive humming". She wouldn't risk it.`},{text:`Sleeping till 4pm and haunting bodegas`,wrong:`Tempting, but people keep seeing her at 9am. With a guitar.`}],reveal:`Bethesda at nine. The Blue Lantern after dark. She's been playing your song all over the city.`},{id:`meet`,q:`Where will she be waiting?`,need:3,clues:[`d1`,`d2`,`d3`,`d4`],phase:3,requires:[`stay`,`routine`],options:[{text:`The top of the Empire State Building`,wrong:`Sophie is scared of lifts. She took the stairs in a four-floor Travelodge.`},{text:`JFK arrivals, holding a sign`,wrong:`Too easy. She's been hiding for weeks — she wants you to find her.`},{text:`The Brooklyn Bridge at sunset`,correct:!0}],reveal:`The bridge at dusk. Your photograph. Where the lanterns meet the water. It's time.`}],clues:{a1:{d:`where`,title:`Weird hours`,text:`Priya: Sophie keeps posting at 3am London time.`,src:`Message from Priya`},a2:{d:`where`,title:`Builder's tea`,text:`Luis: an English girl asked for "a proper builder's tea" at his cart.`,src:`Luis Ortega`},a3:{d:`where`,title:`Heather from home`,text:`An unstamped package: dried heather from Harwick Bay, hand-delivered.`,src:`Dev Raman`},a4:{d:`where`,title:`Yellow reflection`,text:`@softlanterns story: a yellow cab reflected in a guitar-case latch.`,src:`Jaylen Brooks`},a5:{d:`where`,title:`Harwick Bay?`,text:`Overheard: a British girl asked the baristas if they'd heard of Harwick Bay.`,src:`Overheard at Morning Glory Café`},b1:{d:`stay`,title:`Eleven o'clock slice`,text:`Rosa: an English girl buys a plain slice at 11pm, heads back to Kent Ave.`,src:`Rosa Bellini`},b2:{d:`stay`,title:`"S. Hart"`,text:`Hana: rehearsal room booked by S. Hart, address a hostel on Kent Ave.`,src:`Hana Kim`},b3:{d:`stay`,title:`The window`,text:`Your photo: a guitar case with a heather sticker in a Kent Ave hostel window.`,src:`Your photograph`},b4:{d:`stay`,title:`Stairwell music`,text:`Overheard: a musician practises in the Kent Ave hostel stairwell every night.`,src:`Overheard at the Waterfront Market`},c1:{d:`routine`,title:`The lantern song`,text:`Bea: a redhead busks Paper Lanterns at Bethesda at 9am.`,src:`Bea Lindqvist`},c2:{d:`routine`,title:`Sitting in`,text:`Theo: a London guitarist plays the Blue Lantern Thu & Sun nights.`,src:`Theo Marsh`},c3:{d:`routine`,title:`The guestbook`,text:`Ruth: lantern sketch by the blue whale — "S. — you always loved the whale."`,src:`Ruth Abernathy`},c4:{d:`routine`,title:`Staff paper`,text:`Ezra: an English girl buys music paper every afternoon, asks about bridges.`,src:`Ezra Feld`},d1:{d:`meet`,title:`Proudest photograph`,text:`Marguerite: a musician asked which photo you're proudest of — the bridge at dusk.`,src:`Marguerite Okafor`},d2:{d:`meet`,title:`Your turn`,text:`Sophie: "Where the lanterns meet the water. 🏮🌉"`,src:`Message from Sophie`},d3:{d:`meet`,title:`Chalk lantern`,text:`Your photo: a chalk paper lantern on the bridge walkway, "S+E".`,src:`Your photograph`},d4:{d:`meet`,title:`The 1920 map`,text:`Ezra: she circled the Brooklyn Bridge on an old map — "sunset".`,src:`Ezra Feld`}},overhears:{a5:[`Two baristas, while steaming milk:`,`"That British girl came in again — the one with the guitar."`,`"The one who asked if we'd heard of Harwick Bay? Where even is that?"`,`Harwick Bay. Home. Nobody in New York has heard of Harwick Bay.`],b4:[`At the next table, two backpackers:`,`"The hostel on Kent is great but there's a girl who practises guitar in the stairwell every night."`,`"Oh, the lantern song girl? She's really good, honestly."`]},photoClues:{b3:`Zooming in on your shot: in a hostel window on Kent Ave, a guitar case. On it — a sticker of a heather sprig. Sophie's case.`,d3:`Something on the walkway: a chalk drawing of a paper lantern. Underneath, small and neat: "S+E".`},messages:[{id:`m_mum1`,from:`Mum`,when:{day:1,hour:8},text:`Landed OK? Please eat something that isn't coffee. Love you x`},{id:`m_soph1`,from:`Sophie`,when:{day:1,hour:8.2},text:`Morning from London!! 🇬🇧 rehearsals all week so I might go quiet. miss you. go take pretty pictures.`},{id:`m_marg1`,from:`Marguerite`,when:{day:1,hour:10},text:`Welcome to the residency. Studio is in Midtown, off Times Square. Come by when you're ready — the city isn't going anywhere.`},{id:`m_dev1`,from:`Dev`,when:{day:2,hour:9},text:`we are out of oat milk. this is a crisis. also rosa says hi, she likes you, that never happens`},{id:`m_priya`,from:`Priya`,when:{day:3,hour:14,phase:2},clue:`a1`,text:`ok random but Soph keeps posting at like 3am London time?? either she's become a vampire or she's not in London 🧛‍♀️`},{id:`m_soph2`,from:`Sophie`,when:{day:4,hour:12,phase:2},text:`sorry been quiet!! london is MAD. what's your favourite thing about NY so far?`,replies:[{text:`The light. It bounces off everything.`,answer:`of course it's the light 🙄📷 never change`,mood:4},{text:`The pizza. Obviously.`,answer:`FOLD IT. I've heard you have to fold it. (no reason)`,mood:5},{text:`Honestly? Missing you.`,answer:`stop it. you'll make me cry on the tube. (the tube. in london. where I am.)`,mood:8}]},{id:`m_mum2`,from:`Mum`,when:{phase:3},text:`Your sister sounds very happy. Suspiciously happy. Are you two up to something? x`},{id:`m_express`,from:`Dev`,when:{deduction:`where`},text:`pro tip: take the express trains. you're a local now. (fast travel time halved)`,perk:`express`},{id:`m_soph3`,from:`Sophie`,when:{deductions:[`stay`,`routine`]},clue:`d2`,text:`Found you ages ago, Em. Your turn. Where the lanterns meet the water. 🏮🌉`}],tutorial:[{id:`talk_dev`,text:`Say hi to your roommate Dev`},{id:`eat`,text:`Get something to eat`},{id:`metro`,text:`Take the subway (find a Ⓜ station)`},{id:`work`,text:`Visit the Lumen Residency in Midtown`},{id:`sleep`,text:`Head home and sleep when it's late`}],work:{poi:`studio`,label:`Residency`,assignments:[{spot:`archMorning`,brief:`Washington Arch in morning light (the Village, 7–10:30am)`},{spot:`timesNight`,brief:`Times Square after dark (Midtown, after 7:30pm)`},{spot:`bowBridge`,brief:`Bow Bridge in the afternoon (Central Park, 2:30–6:45pm)`},{spot:`museumSteps`,brief:`The museum steps (Upper West Side, 9am–4:30pm)`},{spot:`skyline`,brief:`Manhattan from the Brooklyn waterfront (any time)`},{spot:`empireBelow`,brief:`Empire State from below (Midtown, daytime)`},{spot:`stoops`,brief:`Brownstone stoops (Upper West Side, daytime)`},{spot:`canopy`,brief:`Autumn canopy (Central Park, daytime)`}],pay:80,session:{name:`Editing session`,hours:3,pay:40,text:[`You spend three hours in the darkroom. The red light makes everything feel like a secret.`,`Marguerite circles two frames on your contact sheet in grease pencil. "These. Not those."`,`You scan, crop, argue with yourself about a horizon line. The horizon wins.`]}},pursuit:{intro:[`Your phone buzzes. A photo: a paper lantern, hanging from the arcade at Bethesda Terrace.`,`Sophie: "Come find me, Em. You've got till sunset. 🏮"`],steps:[{district:`centralpark`,at:[0,12],name:`Bethesda Terrace`,seconds:200,note:[`A paper lantern hangs from the arcade. Inside, a folded note in Sophie's handwriting:`,`"My morning spot. Every day at nine I played our song and hoped some tourist would film it and you'd see. Nobody did. Next: where I play after dark."`]},{district:`village`,cell:[1,0],side:`w`,name:`The Blue Lantern`,seconds:200,note:[`Theo is waiting outside the club, grinning, holding a second lantern.`,`"She said you'd come. She also said to tell you: 'the photo you're proudest of'." He shoos you off. "Go. Before the sun does."`]},{district:`brooklyn`,at:[-92,50],name:`The Brooklyn Bridge`,seconds:240,final:!0}]},reunion:{district:`brooklyn`,at:[-100,50],sisterFace:-Math.PI/2,hour:18.55,lines:[{who:`sister`,text:`You took your time.`},{who:`choice`,options:[{text:`You flew three thousand miles to leave me riddles?`,reply:`I flew three thousand miles to watch you solve them. Worth every penny.`},{text:`Hi, Soph.`,reply:`…Hi, Em. (She's crying. So are you. Neither of you mentions it.)`},{text:`I knew it was you the second I smelled that heather.`,reply:`Mum grows it by the back door. I nicked a handful at the airport. Customs were confused.`}]},{who:`sister`,text:`I got a gig. Two weeks at the Blue Lantern. I wanted you to find me — not the other way round. You always find the good stuff.`},{who:`sister`,text:`Take my picture. Now. The second after I laugh — that's what Marguerite told you, right? I read your emails over your shoulder for twenty years.`},{who:`narrate`,text:`She laughs. You take it. The bridge goes gold, then pink, then blue, and the city switches on around you like someone just remembered you were here.`}]},epilogue:{as:`sophie`,district:`brooklyn`,spawn:[-20,8],goal:`glory`,hour:8.2,intro:[`Epilogue — Sophie`,`The next morning. Emma is still asleep on the loft sofa, camera on her chest like a cat.`,`Your turn to find her something. Go get breakfast from her café.`],cards:[`Six weeks ago, I landed at JFK with a guitar, a borrowed coat, and a very bad plan.`,`Dev let me drop the heather. Rosa fed me every night and never once told. Ruth let me scribble in her guestbook. Theo let me steal his stage. Everyone in this city said yes to a stranger.`,`I watched you get braver. You started talking to people. You started getting into the photos instead of standing behind them.`,`I was going to surprise you. Turns out you surprised me — you built a whole life here, one slice and one stranger at a time.`,`Next spring you have an exhibition in London. I've already started hiding clues.`]},trueEnding:[`Six months later.`,`A small gallery in London. On the walls: Emma's New York — Rosa folding a slice, Bea tangled in eleven leads, Luis laughing mid-pour, Theo's hands on the strings.`,`In the corner, Sophie plays a new song. It is called "Kent Avenue".`,`Somehow they all came. Dev brought a recording of the subway doors. Ruth brought the guestbook page. Marguerite gave a speech that made a critic cry.`,`Two cities. Two sisters. One very small room that holds all of it.`],reflections:{1:[`Everything here is louder, taller, faster. I keep looking up. Dev says that's how they spot the new ones.`,`Tried to text Soph a photo of the skyline. Deleted it. It's not the same as her seeing it.`],2:[`The city is starting to know my face. Rosa. Luis. Even the pigeons, maybe.`,`I got a good frame today. Not a pretty one — a true one. Marguerite would say that's better.`],3:[`Something's off with Soph. The timings, the heather, the tea. I can feel her — like when she used to hide behind the curtains and forget her feet showed.`,`I'm not sure if I'm hunting her or she's hunting me.`],4:[`Tomorrow. It's tomorrow. I can feel it.`]}},We={nyc:Ue,london:{id:`london`,city:`London`,currency:`£`,backdrop:`london`,protagonist:`sophie`,sister:`emma`,startDistrict:`kingscross`,roommate:`kwame`,startMoney:110,weather:{rain:.45,cloudy:.35,leaves:!1},prefs:[`sweet`,`comfort`],season:`April`,metro:{name:`the Tube`,lines:[{name:`Northern`,color:`#1c1c1c`,stops:[`camden`,`kingscross`,`southbank`]},{name:`Piccadilly`,color:`#003688`,stops:[`kingscross`,`bloomsbury`]},{name:`Central`,color:`#dc241f`,stops:[`notting`,`bloomsbury`]},{name:`Circle`,color:`#ffd300`,stops:[`notting`,`kingscross`]}],map:{camden:[.52,.12],kingscross:[.62,.36],bloomsbury:[.5,.56],notting:[.14,.5],southbank:[.6,.86]},verbs:[`"Mind the gap." You mind it. You always mind it.`,`Someone makes eye contact on the Tube. The whole carriage tenses.`,`A busker at the interchange plays Wonderwall. Of course he does.`,`Your Oyster card beeps red. You swallow the shame and top up.`]},districts:[{id:`kingscross`,name:`King's Cross`,sub:`St Pancras, the canal & home`,grid:[`v...v`,`yv.vy`,`yyvyy`,`y.yyv`,`yyyyv`],styles:{v:`victorian`,y:`yellowbrick`},spawn:[4,-22],landmarks:[{type:`stPancras`,at:[0,-100]}],pois:[{id:`home`,type:`home`,name:`Home — Argyle St Flat`,cell:[0,0],side:`n`},{id:`kx_station`,type:`station`,name:`King's Cross St Pancras`,at:[0,-44]},{id:`platform4`,type:`eat`,name:`Platform 4 Café`,cell:[-1,-1],side:`e`,hours:[6.5,19],sign:{bg:`#1d3b2a`,fg:`#f1e3b8`},menu:[{name:`Full English (beans touching everything)`,price:11,hunger:55,mood:6,tag:`comfort`,note:`Dotty adds an extra hash brown "for the journey". You aren't going anywhere.`},{name:`Tea and a jam scone`,price:5,hunger:20,mood:8,tag:`sweet`,note:`Jam first. Cream second. Dotty nods — correct answer.`},{name:`Bacon roll with brown sauce`,price:5,hunger:30,mood:5,tag:`bold`,note:`Brown sauce is not a flavour. It's a feeling.`}]},{id:`granary`,type:`eat`,name:`Granary Square Street Food`,at:[-50,50],hours:[11,21],menu:[{name:`Halloumi fries with pomegranate`,price:8,hunger:35,mood:7,tag:`comfort`,note:`Squeaky. Salty. Perfect.`},{name:`Churros with dark chocolate`,price:6,hunger:20,mood:9,tag:`sweet`,note:`You eat them by the fountains while children scream through the jets.`}]},{id:`barge`,type:`hangout`,name:`The Book Barge`,at:[-44,64],hours:[11,19],text:[`A narrowboat full of second-hand books. The owner plays the ukulele badly and with total conviction.`,`You find a songbook from 1974 with someone's pencilled chords in the margins. You buy it immediately.`]},{id:`kingsplace`,type:`hangout`,name:`King's Place Hall`,cell:[1,-1],side:`w`,hours:[12,23],sign:{bg:`#e8e2d4`,fg:`#1d1d1d`,font:`Helvetica, Arial, sans-serif`},text:[`A lunchtime recital: a cellist plays Bach so quietly the whole hall leans in.`,`An experimental set with a harp and a laptop. It shouldn't work. It absolutely works.`]},{id:`lighthouse`,type:`gem`,name:`The Lighthouse (pub)`,cell:[1,1],side:`w`,hidden:!0,hours:[12,23.5],sign:{bg:`#2a1a12`,fg:`#f3cf84`},menu:[{name:`Half a cider and a packet of scampi fries`,price:5,hunger:12,mood:13,tag:`comfort`,note:`The landlord has a lighthouse painting just like the one in Harwick Bay. You stare at it too long.`}]}],photoSpots:[{id:`stpClock`,name:`St Pancras Clock, Late Light`,at:[30,-72],target:[30,36,-98],hours:[15,19.5],desc:`Red brick and a clock face catching the afternoon.`},{id:`granaryFountains`,name:`Granary Square Fountains`,at:[-50,38],target:[-50,1,52],hours:[18.5,25],desc:`Lit jets and kids running through them in coats.`}]},{id:`southbank`,name:`South Bank`,sub:`The Thames, the Eye & Waterloo`,grid:[`WWWWW`,`..m..`,`mm.mm`,`yymyy`,`yyyyy`],styles:{m:`modern`,y:`yellowbrick`},spawn:[0,20],landmarks:[{type:`londonEye`,at:[-60,-95],rot:Math.PI/2},{type:`waterlooBridge`,at:[40,-70]},{type:`bigBen`,at:[-150,-372],noCollide:!0},{type:`shard`,at:[300,140],noCollide:!0}],pois:[{id:`sb_station`,type:`station`,name:`Waterloo`,at:[0,6]},{id:`riverside`,type:`work`,activity:`gig`,name:`Riverside Hall`,cell:[-1,0],side:`n`,hours:[12,24],sign:{bg:`#111`,fg:`#ffffff`,font:`Helvetica, Arial, sans-serif`}},{id:`crepes`,type:`eat`,name:`Riverside Crêpes`,at:[54,-46],hours:[10,22],menu:[{name:`Nutella and banana crêpe`,price:7,hunger:30,mood:9,tag:`sweet`,note:`You eat it on a bench while a seagull plans your downfall.`},{name:`Ham and cheese galette`,price:8,hunger:38,mood:5,tag:`comfort`,note:`Crispy edges. The seagull is still watching.`}]},{id:`markethall`,type:`eat`,name:`Southwark Market Hall`,cell:[1,1],side:`n`,hours:[10,20],sign:{bg:`#3a4a2a`,fg:`#f3e6c4`},overhear:`a5`,menu:[{name:`Toasted cheese with kimchi`,price:9,hunger:40,mood:8,tag:`comfort`,note:`A queue of forty people. Justified.`},{name:`Custard doughnut`,price:4,hunger:18,mood:9,tag:`sweet`,note:`Custard on your chin, your coat, and somehow your ear.`},{name:`Scotch egg`,price:6,hunger:30,mood:4,tag:`bold`,note:`An egg wearing a sausage coat. Britain, everyone.`}]},{id:`undercroft`,type:`hangout`,name:`The Skate Undercroft`,at:[-50,-44],hours:[10,23],text:[`Graffiti, concrete, the clack of boards. A ten-year-old lands a kickflip and doesn't even look pleased. Iconic.`,`You sit on the ledge and write a verse to the rhythm of wheels on concrete.`]},{id:`bankside`,type:`hangout`,name:`Bankside Gallery`,cell:[2,0],side:`w`,hours:[10,18],sign:{bg:`#f4f4f4`,fg:`#b3121e`,font:`Helvetica, Arial, sans-serif`},text:[`A huge turbine hall with one enormous sculpture. You feel very small. That's the point.`,`A room of photographs of American diners. Weirdly homesick for a place you've never lived.`]},{id:`hatch`,type:`gem`,name:`The Wharf Hatch`,cell:[-2,0],side:`e`,hidden:!0,hours:[8,17],sign:{bg:`#e0a82e`,fg:`#222`},menu:[{name:`Flat white and a cinnamon knot from a hole in a wall`,price:5,hunger:15,mood:13,tag:`sweet`,note:`The best cinnamon knot in London is served from a window you nearly walked past.`}]}],photoSpots:[{id:`waterlooSunset`,name:`Waterloo Sunset`,at:[40,-140],target:[-150,60,-372],hours:[17.2,19.8],clue:`d3`,desc:`Parliament going gold. The river full of light.`},{id:`eyeNight`,name:`The Eye at Night`,at:[-30,-74],target:[-60,64,-95],hours:[19.3,26],desc:`A wheel of light turning slower than you can see.`},{id:`thames`,name:`The Thames from the Embankment`,at:[0,-76],target:[-60,30,-220],hours:[0,24],desc:`Grey-green water, a tour boat, gulls.`}]},{id:`notting`,name:`Notting Hill`,sub:`Portobello Road & pastel houses`,grid:[`ppppp`,`pptpp`,`ttppt`,`ptp.p`,`ppppp`],styles:{p:`pastel`,t:`terrace`},spawn:[44,66],landmarks:[],pois:[{id:`nh_station`,type:`station`,name:`Notting Hill Gate`,at:[44,58]},{id:`nells`,type:`hangout`,name:`Nell's Bookshop`,cell:[0,0],side:`e`,hours:[9,19],sign:{bg:`#2a4a6a`,fg:`#f6ecd2`},text:[`Nell hands you a battered book of poems "for the Tube". It has someone else's underlining. It's better that way.`,`A cat sleeps on the travel section. Nell says it has never been further than Holland Park.`]},{id:`pereira`,type:`eat`,name:`Pereira's Café & Rooms`,cell:[1,0],side:`w`,hours:[7,17],sign:{bg:`#f6d9a8`,fg:`#7a2a1a`},menu:[{name:`Pastel de nata and a galão`,price:5,hunger:18,mood:10,tag:`sweet`,note:`Mrs Pereira says her mother's recipe. Her mother says it's her grandmother's. Nobody is lying.`},{name:`Bifana (pork sandwich)`,price:8,hunger:40,mood:6,tag:`comfort`,note:`Garlicky, messy, served with a stern warning about napkins.`}]},{id:`portobello`,type:`eat`,name:`Portobello Market Stalls`,at:[58,40],hours:[9,17],overhear:`b4`,menu:[{name:`Paella from a pan the size of a car tyre`,price:9,hunger:45,mood:7,tag:`comfort`,note:`The man stirs it with a shovel. Genuinely a shovel.`},{name:`Brownie from the posh stall`,price:4,hunger:15,mood:8,tag:`sweet`,note:`It costs four pounds. It is worth six.`}]},{id:`antiques`,type:`hangout`,name:`Antiques Arcade`,cell:[-1,-1],side:`e`,hours:[9,17],sign:{bg:`#4a2a1a`,fg:`#e8cf9a`},text:[`Old cameras, brass compasses, a stuffed owl with a price tag reading "ASK". You don't ask.`,`You find a 1960s record player like Mum's. You stand in front of it for a very long time.`]},{id:`cinema`,type:`hangout`,name:`Lumière Cinema`,cell:[0,1],side:`e`,hours:[13,24],sign:{bg:`#5a0f1a`,fg:`#ffe7a8`},text:[`Velvet armchairs, footstools, a blanket. Watching a film here feels like being tucked in.`,`A black-and-white romance. The man next to you sobs openly. Respect.`]},{id:`mews`,type:`gem`,name:`The Hidden Mews Café`,cell:[-2,1],side:`e`,hidden:!0,hours:[8,16],sign:{bg:`#bfe3c0`,fg:`#2a4a2a`},menu:[{name:`Lemon drizzle and a pot of Earl Grey`,price:6,hunger:18,mood:13,tag:`sweet`,note:`Wisteria over the door, a tiny courtyard, a robin on the next table.`}]}],photoSpots:[{id:`pastelDawn`,name:`Pastel Row at Dawn`,at:[0,-74],target:[0,6,-100],hours:[6.3,9.8],desc:`Pink, blue, mint, butter-yellow. A whole street dressed for a party that hasn't started.`},{id:`portobelloWindow`,name:`Windows above Portobello`,at:[24,8],target:[35,9,0],hours:[7,20],clue:`b3`,desc:`Sash windows, window boxes, the rooms above Pereira's.`}]},{id:`camden`,name:`Camden`,sub:`The Lock, the market & live music`,grid:[`vvvvv`,`vv.vv`,`v..vv`,`vvvvv`,`yyyyy`],styles:{v:`victorian`,y:`yellowbrick`},spawn:[10,-56],noTraffic:{x:[-25,25],z:[-25]},landmarks:[{type:`camdenLock`,at:[-20,-25]},{type:`camdenSign`,at:[0,-48]}],pois:[{id:`cm_station`,type:`station`,name:`Camden Town`,at:[10,-62]},{id:`aggies`,type:`eat`,name:`Aggie's Pie & Mash`,at:[-34,-6],hours:[10,20],menu:[{name:`Pie, mash and liquor (it's parsley sauce, relax)`,price:7,hunger:50,mood:7,tag:`comfort`,note:`Aggie watches you take the first bite like it's an exam.`},{name:`Jellied eels`,price:5,hunger:20,mood:-2,tag:`bold`,note:`You tried. That's what matters. Aggie cackles for a full minute.`}]},{id:`noodles`,type:`eat`,name:`Lockside Noodles`,at:[-6,-4],hours:[11,23],menu:[{name:`Katsu curry`,price:9,hunger:45,mood:7,tag:`comfort`,note:`Eaten on a bench overlooking the lock. A narrowboat drifts by with a dog on the roof.`},{name:`Bubble tea, extra pearls`,price:5,hunger:12,mood:8,tag:`sweet`,note:`You choke on a pearl. A goth teenager pats your back kindly.`}]},{id:`lockside`,type:`hangout`,name:`Lockside Stage`,cell:[1,0],side:`w`,hours:[17,26],sign:{bg:`#0f0f12`,fg:`#ff6a8a`,font:`Helvetica, Arial, sans-serif`},text:[`A punk band, then a folk duo, then a man with a theremin. Camden doesn't do genres.`,`Callum drags you to the front. The floor is sticky. The music is loud. You are happy.`]},{id:`practice`,type:`work`,activity:`practice`,name:`Stables Practice Rooms`,cell:[-1,1],side:`n`,hours:[8,23],sign:{bg:`#2a2a2a`,fg:`#9ae0ff`,font:`Helvetica, Arial, sans-serif`}},{id:`stables`,type:`hangout`,name:`Stables Market`,cell:[-2,0],side:`e`,hours:[10,19],sign:{bg:`#6a2a1a`,fg:`#f3cf84`},text:[`Vintage leather jackets, horse statues, incense, a man selling only left-handed scissors.`,`You try on a velvet coat. You look like a Victorian ghost. You almost buy it.`]},{id:`crowsnest`,type:`gem`,name:`The Crow's Nest (rooftop)`,cell:[2,1],side:`w`,hidden:!0,hours:[16,24],sign:{bg:`#101820`,fg:`#9ad0ff`},menu:[{name:`Lemonade on a roof with the whole of North London below`,price:4,hunger:5,mood:14,tag:`sweet`,note:`You can see the Post Office Tower and, if you squint, your whole future.`}]},{id:`callumDate`,type:`gem`,name:`The Lockkeeper's Table`,cell:[0,1],side:`n`,hidden:!0,requires:`perk:reservation`,hours:[18,23],sign:{bg:`#2f3e2a`,fg:`#efe3c4`},date:`callum`}],photoSpots:[{id:`lockGates`,name:`Lock Gates at Golden Hour`,at:[-34,-15],target:[-28,1,-25],hours:[16.8,19.3],desc:`Old timber gates, water pouring through, a heron pretending not to be impressed.`},{id:`camdenSignShot`,name:`The Camden Lock Sign`,at:[0,-36],target:[0,10,-48],hours:[0,24],desc:`Black iron letters over the bridge crowd.`}]},{id:`bloomsbury`,name:`Bloomsbury`,sub:`The British Museum & garden squares`,grid:[`yyyyy`,`yy.yy`,`yGyGy`,`vyyyv`,`yyvyy`],styles:{y:`yellowbrick`,v:`victorian`},spawn:[50,14],landmarks:[{type:`britishMuseum`,at:[0,-50],opts:{width:34}}],pois:[{id:`bl_station`,type:`station`,name:`Russell Square`,at:[50,6]},{id:`institute`,type:`work`,activity:`session`,name:`Hale Institute of Music`,cell:[1,-1],side:`w`,hours:[8,20],sign:{bg:`#1d2a44`,fg:`#e8d7a8`}},{id:`bmHang`,type:`hangout`,name:`The British Museum`,at:[0,-36],hours:[10,17.5],text:[`The Rosetta Stone, surrounded by forty people photographing it. You photograph the forty people.`,`The Great Court roof: a glass sky of triangles. You hum a chord progression to its rhythm.`]},{id:`marchmont`,type:`eat`,name:`Marchmont St Café`,cell:[-1,1],side:`n`,hours:[7,18],sign:{bg:`#f1e6d0`,fg:`#3a2a1a`},menu:[{name:`Victoria sponge, the size of a paving slab`,price:5,hunger:25,mood:9,tag:`sweet`,note:`The owner cuts it with a ruler. Very Bloomsbury.`},{name:`Jacket potato, beans and cheese`,price:7,hunger:50,mood:6,tag:`comfort`,note:`Humble. Hot. Emotionally supportive.`}]},{id:`kiosk`,type:`eat`,name:`Garden Square Kiosk`,at:[44,-6],hours:[8,18],menu:[{name:`Bacon sandwich and a builder's tea`,price:6,hunger:35,mood:7,tag:`comfort`,note:`Tea so strong the spoon could stand in it.`},{name:`Ice cream in April (brave)`,price:3,hunger:8,mood:6,tag:`sweet`,note:`It's eleven degrees. You regret nothing.`}]},{id:`vinyl`,type:`hangout`,name:`Bloomsbury Records`,cell:[0,1],side:`n`,hours:[11,20],sign:{bg:`#141414`,fg:`#ffd27a`,font:`Helvetica, Arial, sans-serif`},text:[`Listening booths with velvet curtains. You spend an hour with a Nick Drake record you already own.`,`The owner plays you a folk singer from 1971 who "never got her due". You buy the record. She gets her due.`]},{id:`courtyard`,type:`gem`,name:`Hidden Courtyard Tea Room`,cell:[2,1],side:`w`,hidden:!0,hours:[10,17],sign:{bg:`#e6d5ea`,fg:`#3a1a4a`},menu:[{name:`Rose tea and a Welsh cake`,price:5,hunger:15,mood:13,tag:`sweet`,note:`Through an archway, a courtyard nobody else seems to know about. A fountain the size of a sink.`}]}],photoSpots:[{id:`portico`,name:`The Museum Portico`,at:[0,-22],target:[0,12,-46],hours:[10,16.5],desc:`Columns like a stone forest.`},{id:`planeTrees`,name:`Plane Trees, Garden Square`,at:[-50,-2],target:[-50,5,10],hours:[7,19],desc:`Spring leaves coming in lime green against old brick.`}]}],npcs:[{id:`kwame`,name:`Kwame Asante`,role:`Flatmate · architecture student`,look:{skin:5124124,hair:1314828,hairStyle:`short`,top:14725184,bottom:2763306,coat:2767450},schedule:[{from:6,to:11,district:`kingscross`,at:[5,-20]},{from:11,to:18,district:`bloomsbury`,at:[52,16]},{from:18,to:24,district:`kingscross`,cell:[1,-1],side:`w`}],intro:[`Morning, flatmate. I'm Kwame. I build tiny cardboard buildings for a living, or I will once I graduate.`,`Rules: the boiler has moods, the downstairs neighbour has a parrot, and the parrot knows swear words. Not from me.`],lines:{1:[`King's Cross used to be all warehouses. Now it's all people pretending not to be tourists at Platform 9¾.`],2:[`St Pancras is Victorian gothic. Which is architect for "extremely extra".`,`You leave the flat with your guitar every day like it's a pet. Respect.`],3:[`You've got your detective face on. Who died? Nobody? Good.`],4:[`Go! I'll water your basil. It's mostly dead but I'll water it.`]},city:[`Londoners don't say "that's terrible". They say "that's not ideal". Learn this.`,`If someone says "we must get coffee sometime", you will never get coffee. It's fine. It's culture.`],sister:{low:`Your sister's the photographer in New York? Proper glamorous.`,high:`You two sound like the same person who got split across the Atlantic.`},clues:[{id:`a3`,minPhase:2,minRel:1,lines:[`Something odd came through the letterbox. A photo print — of our front door. Taken from across the road. On film.`,`No note. Either you've got a stalker with brilliant composition, or…`]}],meal:`Kwame designs you a house on a napkin. It has a room just for guitars and a moat. "Standard."`,deep:{3:`My mum still sends me kenkey from Accra in the post. It arrives smelling like home and also like the Royal Mail.`},perk:{rel:4,id:`bike`,name:`Bike-share key`,desc:`Kwame lends you his cycle-hire key. Sprint speed +30%.`}},{id:`dotty`,name:`Dotty Price`,role:`Runs Platform 4 Café since forever`,look:{skin:15845797,hair:14209224,hairStyle:`bun`,top:8006202,bottom:2763306,scarf:2779722},schedule:[{from:6.5,to:19,district:`kingscross`,cell:[-1,-1],side:`e`,t:.3}],intro:[`Hello, petal. New round here? Sit down, you look like you've been rained on. You have been rained on. It's London.`],lines:{1:[`Tea's on the house for first-timers. Second time you're family and family pays.`],2:[`I've served train drivers, rock stars and a very rude duke. The train drivers tip best.`],3:[`You're asking a lot of questions for someone with a scone going cold.`],4:[`Go on, love. Run. I'll keep the kettle on.`]},city:[`A queue is sacred. Jump it and they'll never find the body.`,`Rain isn't weather here. It's a personality.`],sister:{low:`A sister in America! Is she eating properly? They have very big portions over there.`,high:`You've got the look of someone missing someone.`},clues:[{id:`a4`,minPhase:2,minRel:1,lines:[`An American girl came in last week. Film camera round her neck. Asked the way to Argyle Street.`,`Funny thing — she had your chin. Exactly your chin, petal.`]}],meal:`Dotty sits down with you for the first time in eleven years. She tells you about the duke.`,deep:{3:`My sister Rita moved to Australia in 1971. We wrote letters every week for fifty years. I've got every one.`}},{id:`imogen`,name:`Prof. Imogen Hale`,role:`Internship mentor · composer`,look:{skin:15517864,hair:9079434,hairStyle:`bob`,top:1907997,bottom:1907997,coat:3103300,scarf:13208122},schedule:[{from:9,to:18,district:`bloomsbury`,cell:[1,-1],side:`w`,t:.3}],intro:[`Sophie Hart. Your audition tape was a song called "Paper Lanterns", played on a guitar with a broken G string. I hired you because you didn't stop.`,`Here, we don't play music at people. We play it with them. Ears first.`],lines:{1:[`Theory in the mornings, practice in the afternoons, and at night — listen to the city. It's in 7/8, mostly.`],2:[`Your ear's sharpening. You caught the modulation in the Brahms before the cellists did.`],3:[`You're distracted. Good distracted or bad distracted? …Ah. Good.`],4:[`Whatever it is, go. The best music comes from running towards something.`]},city:[`London's full of people who came here to be someone. Most of us ended up being ourselves, which was harder.`,`Every busker in the Tube auditions. Did you know? Some of them are better than my students.`],sister:{low:`Your sister — the photographer. Musicians and photographers both try to catch something that won't hold still.`,high:`Write her something. Not for an audience. Just for her.`},clues:[{id:`c4`,minPhase:3,minRel:1,lines:[`A photographer asked permission to document our orchestra rehearsal. American. Very quiet, very good.`,`She knew your name, Sophie. She asked which chair you sit in.`]}],meal:`Imogen hums the harmony line to whatever song is on the café radio. She is always right.`,deep:{3:`I wrote my first symphony at twenty-three for my brother. He never heard it. Play things for people while they can hear them.`,5:`There's a showcase in the summer. I've put your name down. Don't argue.`}},{id:`felix`,name:`Felix Adeyemi`,role:`Museum archivist · Reading Room`,look:{skin:5913126,hair:1314828,hairStyle:`short`,top:14207144,bottom:3815994,coat:4864554,accessory:`bag`},schedule:[{from:10,to:17.5,district:`bloomsbury`,at:[-8,-32]},{from:17.5,to:22,district:`bloomsbury`,cell:[0,1],side:`n`,t:.3}],intro:[`Hello. Felix. I work in the archive, which means I spend all day with things older than countries and I still can't fold a fitted sheet.`],lines:{1:[`The Reading Room was where Marx wrote, and Woolf, and a man who spent forty years on a dictionary of sneezes.`],2:[`Every object here was someone's everyday thing once. A comb. A cup. A love letter. That's what I find moving.`],3:[`You've been in four times this week. Either you love Assyrian reliefs or you're up to something.`],4:[`Off you go. History will wait. It's very good at that.`]},city:[`Bloomsbury has more blue plaques than pigeons. Nearly.`,`Londoners will walk past the Rosetta Stone on their way to buy a meal deal. It's beautiful.`],sister:{low:`You and your sister both make art. Sounds like a competitive household.`,high:`You talk about her the way people here talk about lost things they're sure they'll find.`},clues:[{id:`c2`,minPhase:3,minRel:1,lines:[`Someone's been sketching in the Reading Room every day at noon. Always the same thing — paper lanterns.`,`Accent from somewhere across the Atlantic. She left a pencil behind. It has "Lumen Residency, NYC" on it.`]}],meal:`Felix explains, over sandwiches, that the museum owns seven million objects and he has personally catalogued a lot of spoons.`,deep:{3:`I grew up in Peckham. My dad drove the 36 bus past this museum for thirty years and never went in. First thing I did with my staff pass was bring him.`}},{id:`rafi`,name:`Rafi Haddad`,role:`Sound engineer · Riverside Hall`,look:{skin:13011554,hair:2760212,hairStyle:`short`,top:1907997,bottom:2767434,cap:2763306},schedule:[{from:12,to:24,district:`southbank`,cell:[-1,0],side:`n`,t:.35}],intro:[`You're Imogen's new intern. Rafi. I run sound here. If you ever say "is this thing on" into my microphone I will retire.`],lines:{1:[`The river changes the sound of everything here. Foghorns in the reverb.`],2:[`Play me something on the empty stage sometime. The room tells you who you are.`],3:[`People keep asking me for things lately. Very specific things. I'm a man of mystery now.`],4:[`Go on. Sunset's at quarter to eight. Just saying.`]},city:[`The South Bank is where London comes to pretend it's on holiday.`,`Everyone says the Eye is a tourist trap. Everyone who says that has been on it at least twice.`],sister:{low:`Your sister takes photographs? Tell her the light on the river at six is criminal.`,high:`If she ever visits, bring her backstage. Best view of the river is from the loading bay.`},clues:[{id:`d1`,minPhase:3,minRel:2,requires:[`stay`,`routine`],lines:[`Right. I'm not meant to say. Someone asked me to cue a recording on the riverside PA at sunset one evening this week.`,`Old cassette transfer. Two little girls singing something about lanterns. I've had it stuck in my head for days.`]}],meal:`Rafi tells you about the time a famous singer's in-ear monitors picked up a taxi radio. "Best gig of her career."`,deep:{3:`My family's from Beirut. My grandmother sang at weddings. Every time I mix a vocal, I'm trying to make it sound like her kitchen.`},perk:{rel:3,id:`venue`,name:`Riverside Hall stage`,desc:`Rafi offers you a slot. Gigs at Riverside Hall are unlocked.`}},{id:`olu`,name:`Olu Bakare`,role:`Skater · the Undercroft`,look:{skin:7226665,hair:1314828,hairStyle:`short`,top:2779786,bottom:3815994,cap:14707242},schedule:[{from:15,to:23,district:`southbank`,at:[-44,-46]}],intro:[`Alright? Olu. Don't stand there, that's where people fall. Stand here. That's where people fall less.`],lines:{1:[`This spot's been here since the seventies. They tried to close it. We said no. Proper no.`],2:[`You write songs? Write one about a kickflip. Nobody's done it properly.`],3:[`You keep coming round at sunset. You looking for someone, or just vibes?`],4:[`Go! I'd skate you there but you'd fall.`]},city:[`Tourists film us like we're in a zoo. I charge them a fiver. Kidding. Mostly.`,`Southbank is concrete with a heart. That's London, innit.`],sister:{low:`Big sister? She sounds cool. Is she cool?`,high:`You're always on about her. It's nice, still.`},clues:[{id:`c1`,minPhase:3,minRel:1,lines:[`There's this photographer comes every evening. American. Shoots us at sunset, never bothers anyone.`,`Gave me a print — look. Look at the back. Little stamp: a paper lantern.`]}],meal:`Olu eats three burgers and explains the physics of a heelflip with chips.`,deep:{3:`My little sister's at uni in Leeds. I send her skating videos. She sends back one-word reviews. "Mid." It's love.`}},{id:`nell`,name:`Nell Whitaker`,role:`Bookseller · Notting Hill`,look:{skin:15845797,hair:10111530,hairStyle:`long`,top:6961754,bottom:2763322,coat:9071178,scarf:14201706},schedule:[{from:9,to:19,district:`notting`,cell:[0,0],side:`e`,t:.3}],intro:[`Welcome, welcome — mind the cat, he's asleep on the guidebooks. He's asleep on everything. I'm Nell.`],lines:{1:[`Yes, this is near where they filmed that film. No, Hugh Grant has never come in. Yes, I'm still waiting.`],2:[`People buy travel books to go places. I sell them to people who want to stay home and dream. Both are valid.`],3:[`You've been through the whole poetry shelf. Something's on your mind.`],4:[`Off you go, love. Books keep.`]},city:[`Notting Hill houses are pastel because a man in the 1950s painted his pink and everyone got competitive.`,`Portobello on a Saturday is a contact sport.`],sister:{low:`A sister abroad. There's a book for that. There's a book for everything. That's the problem.`,high:`Bring her in when she visits. I'll find her the right book. I always find the right book.`},clues:[{id:`b2`,minPhase:3,minRel:1,lines:[`An American bought a guidebook to Notting Hill last week. Asked if I knew anything about the rooms above Pereira's café.`,`I said "only that the breakfast is dangerous". She laughed like — well. Like you, actually.`]},{id:`d4`,minPhase:3,minRel:2,requires:[`routine`],lines:[`She came back. Bought a book of photographs of London bridges. When she paid, I saw she'd folded down one page.`,`Waterloo Bridge. At sunset. She'd written in the margin: "Dad's song".`]}],meal:`Nell reads you tea-leaf fortunes. Yours says "a surprise on water". She says they always say that.`,deep:{3:`I opened this shop after my divorce with a van full of books and absolutely no plan. Twenty years. Still no plan.`}},{id:`pereira`,name:`Mrs. Pereira`,role:`Café owner · lets rooms upstairs`,look:{skin:13011554,hair:1774608,hairStyle:`bun`,top:1915754,bottom:2763306,scarf:14725184},schedule:[{from:7,to:17,district:`notting`,cell:[1,0],side:`w`,t:.3}],intro:[`Bom dia! Come in, come in. You are too thin. Everyone in London is too thin. It's the rain, it washes you away.`],lines:{1:[`My mother made nata in Lisbon, I make nata in London. The rain changes nothing, the butter changes everything.`],2:[`You come every morning now. Good. A café is a clock. People set their lives by it.`],3:[`You are looking at my upstairs windows. Why are you looking at my upstairs windows?`],4:[`Vai! Go! I will save you a nata.`]},city:[`English people apologise to furniture when they bump into it. I have seen it.`,`In Lisbon we have sun. In London we have… very good umbrellas.`],sister:{low:`A sister! I have five. Five! One is enough, believe me.`,high:`Family is the thing you miss even when they are annoying. Especially then.`},clues:[{id:`b1`,minPhase:3,minRel:1,lines:[`My lodger upstairs — American, very sweet. "Miss E.", she signs the book. Up at five every day with a camera.`,`She develops films in my bathroom! Everything smells of chemicals. I don't mind. She brings me photographs of my own café.`]}],meal:`Mrs. Pereira sits with you and shows you photos of all five sisters. It takes an hour. You enjoy every minute.`,deep:{3:`I came to London in 1989 for six months. Thirty-seven years. Six months, I told my mother.`}},{id:`callum`,name:`Callum Reid`,role:`Busker & guitarist · Camden`,romance:!0,look:{skin:15845797,hair:11039802,hairStyle:`short`,top:2763306,bottom:3816010,coat:5916214,accessory:`guitar`},schedule:[{from:11,to:17,district:`camden`,at:[-16,-2]},{from:17,to:26,district:`camden`,cell:[1,0],side:`w`,t:.3}],intro:[`Alright? You've been staring at my chord shapes for three songs. Callum. You play? Course you play, you've got calluses like mine.`],lines:{1:[`Glaswegian, before you ask. Came down for the music, stayed for the pie and mash. Mostly the pie and mash.`],2:[`We should do a song together at the Lockside some night. Nobody would notice. That's the beauty of Camden.`,`You tune by ear. Show-off.`],3:[`You're not listening to me play. You're listening past me. What're you waiting for?`],4:[`Go on then. And come back and tell me the ending. I love an ending.`]},city:[`Camden's where London keeps its leftovers. Punks, goths, lost tourists, me.`,`Nobody in London knows their neighbours. In Glasgow your neighbours know your blood type.`],sister:{low:`A sister, eh? Older? She'll be the sensible one. Aye, I can tell.`,high:`You should write her a song. Or have you already? You have. I can tell.`},clues:[{id:`c3`,minPhase:3,minRel:2,lines:[`Here — someone's been photographing the lock at golden hour every day. Asked me to play "that lantern song".`,`I said I didn't know it. She hummed it. Then she went red and said "forget I asked". Canny accent. American.`]}],meal:`Callum steals your chips while explaining that stealing chips is a Scottish love language.`,deep:{3:`My da played in a ceilidh band. Every Saturday. I learned guitar under the table with the dog.`,5:`I don't know what you're looking for, Soph. But I'm glad I was busking the day you walked past.`},perk:{rel:4,id:`reservation`,name:`Table for two`,desc:`Callum booked The Lockkeeper's Table. New location unlocked in Camden (evenings).`},date:[`Fairy lights along the canal, a table that wobbles, a waiter who calls everyone "boss".`,`Callum: "So what's the song you haven't written yet?"`,`You tell him about a girl with a camera on a bridge at home, and how you've been trying to write the light.`,`He doesn't say anything clever. He just hums a chord under your words. It fits.`]},{id:`aggie`,name:`Aggie Doyle`,role:`Pie & mash stall · Camden`,look:{skin:15845797,hair:14201706,hairStyle:`bun`,top:16777215,bottom:2763306,coat:null,scarf:2771562},schedule:[{from:10,to:20,district:`camden`,at:[-36,-4]}],intro:[`What'll it be, duck? Don't say salad. I'll have you removed.`],lines:{1:[`Forty years I've been feeding this lot. Punks in the eighties, emos in the noughties. Same appetite.`],2:[`You're getting colour in your cheeks. That's the liquor. The parsley kind, before you get ideas.`],3:[`You're snooping. I can tell a snooper. I was one.`],4:[`Leg it, duck!`]},city:[`Americans call it "pie and mashed potato". Mashed potato! Like it's a sentence!`,`If it's raining, it's Tuesday. If it's not raining, it's about to.`],sister:{low:`Sister in New York? Tell her pies are better here. Tell her Aggie said.`,high:`You look like someone who's about to get a nice surprise. Don't ask me how I know.`},clues:[{id:`a2`,minPhase:2,minRel:1,lines:[`Had an American in yesterday. Asked for "the most British thing on the menu". I gave her eels.`,`She ate them! Then tried to pay with a quarter. "That's a quarter, love. This is England." She had a camera. Big one.`]}],meal:`Aggie sits down, puts her feet up on a crate, and tells you who she's fed. The list includes a Rolling Stone.`,deep:{3:`My Terry proposed with a pie. Ring in the crust. I nearly swallowed it. Forty-one years.`}}],deductions:[{id:`where`,q:`Where is Emma, really?`,need:3,clues:[`a1`,`a2`,`a3`,`a4`,`a5`],phase:2,options:[{text:`Still in New York, at the residency`,wrong:`Film prints of your front door. A camera and a quarter. Your chin. No.`},{text:`Hiking in Iceland (she mentioned it once)`,wrong:`Emma owns one pair of walking boots and they are decorative.`},{text:`Here — in London, in secret`,correct:!0}],reveal:`She's here. Emma is somewhere in London. Payback, it seems, is a sister.`},{id:`stay`,q:`Where is she staying?`,need:3,clues:[`b1`,`b2`,`b3`,`b4`],phase:3,options:[{text:`The Savoy`,wrong:`On a residency stipend? Emma once reused a teabag three times "on principle".`},{text:`The rooms above Pereira's café, Notting Hill`,correct:!0},{text:`Kwame's been hiding her in his wardrobe`,wrong:`Kwame's wardrobe is 80% cardboard models. There's no room.`}],reveal:`Above Pereira's. You've been eating her landlady's custard tarts for weeks.`},{id:`routine`,q:`What does her day look like?`,need:3,clues:[`c1`,`c2`,`c3`,`c4`],phase:3,options:[{text:`Busking in Covent Garden`,wrong:`Emma cannot play an instrument. She once broke a kazoo.`},{text:`Reading Room at noon, the lock at golden hour, the Undercroft at dusk`,correct:!0},{text:`Queuing for croissants, mostly`,wrong:`Honestly plausible. But people keep seeing her with a camera, not a croissant.`}],reveal:`Noon in the Reading Room. The lock at golden hour. The Undercroft at dusk. She's been photographing your whole city.`},{id:`meet`,q:`Where will she be waiting?`,need:3,clues:[`d1`,`d2`,`d3`,`d4`],phase:3,requires:[`stay`,`routine`],options:[{text:`Top pod of the London Eye`,wrong:`Emma gets motion sick on a swing. The Eye would finish her.`},{text:`Waterloo Bridge at sunset`,correct:!0},{text:`Heathrow arrivals, holding a sign`,wrong:`She's been here for weeks. She wants you to come to her.`}],reveal:`Waterloo Bridge. Dad's song. The sunset. It's time.`}],clues:{a1:{d:`where`,title:`Missing from the photo`,text:`Priya: Emma isn't in her residency's group photo. She's always in the group photo.`,src:`Message from Priya`},a2:{d:`where`,title:`A quarter, love`,text:`Aggie: an American with a big camera tried to pay with a quarter.`,src:`Aggie Doyle`},a3:{d:`where`,title:`Your front door`,text:`A film print of your front door, taken from across the road, pushed through the letterbox.`,src:`Kwame Asante`},a4:{d:`where`,title:`Your chin`,text:`Dotty: an American girl with a film camera asked the way to Argyle Street.`,src:`Dotty Price`},a5:{d:`where`,title:`Sister in King's Cross`,text:`Overheard: an American photographer said her sister lives in King's Cross.`,src:`Overheard at Southwark Market Hall`},b1:{d:`stay`,title:`"Miss E."`,text:`Mrs. Pereira: her American lodger, "Miss E.", develops film in the bathroom.`,src:`Mrs. Pereira`},b2:{d:`stay`,title:`Rooms above`,text:`Nell: an American asked about the rooms above Pereira's café.`,src:`Nell Whitaker`},b3:{d:`stay`,title:`Film on the sill`,text:`Your photo: film canisters and a heather sprig on the windowsill above Pereira's.`,src:`Your photograph`},b4:{d:`stay`,title:`Up at five`,text:`Overheard: Pereira's lodger is up at five every morning with a camera.`,src:`Overheard at Portobello Market`},c1:{d:`routine`,title:`Lantern stamp`,text:`Olu: a photographer shoots the Undercroft every dusk; her prints carry a lantern stamp.`,src:`Olu Bakare`},c2:{d:`routine`,title:`Noon sketches`,text:`Felix: someone sketches lanterns in the Reading Room at noon. Pencil from the Lumen Residency, NYC.`,src:`Felix Adeyemi`},c3:{d:`routine`,title:`Hummed it`,text:`Callum: someone photographing the lock at golden hour hummed "the lantern song".`,src:`Callum Reid`},c4:{d:`routine`,title:`Which chair`,text:`Imogen: an American photographer documented rehearsal, asked which chair you sit in.`,src:`Prof. Imogen Hale`},d1:{d:`meet`,title:`Sunset cue`,text:`Rafi: someone asked him to play two little girls singing about lanterns on the PA at sunset.`,src:`Rafi Haddad`},d2:{d:`meet`,title:`Dad's song`,text:`Emma: "Dad's favourite song was about a sunset and a bridge. 🌅"`,src:`Message from Emma`},d3:{d:`meet`,title:`Chalk lantern`,text:`Your photo: a chalk lantern on the Waterloo Bridge pavement, "E+S".`,src:`Your photograph`},d4:{d:`meet`,title:`Folded page`,text:`Nell: she folded down Waterloo Bridge in a book of bridges — "Dad's song".`,src:`Nell Whitaker`}},overhears:{a5:[`In the queue behind you, two students:`,`"That American photographer was in again, the one with the old Leica."`,`"She said her sister lives in King's Cross and has no idea she's here. Cute."`],b4:[`A stallholder, packing up, to his neighbour:`,`"Pereira's got a new lodger. Up at five every morning with a camera, clicking at the pastel houses."`,`"Americans," says the neighbour, fondly.`]},photoClues:{b3:`Zooming in: on the sill above Pereira's, a row of film canisters. And tucked between them, a sprig of heather. From home.`,d3:`On the bridge pavement: a chalk paper lantern. Underneath, small and neat: "E+S".`},messages:[{id:`m_mum1`,from:`Mum`,when:{day:1,hour:8},text:`Big day, darling! Remember to eat breakfast. And wear a coat. It's London. x`},{id:`m_em1`,from:`Emma`,when:{day:1,hour:8.2},text:`Good morning London girl!! residency is SO busy, I'll be hard to reach this month. go be brilliant 📷`},{id:`m_imo1`,from:`Imogen`,when:{day:1,hour:10},text:`Welcome aboard. The Institute is in Bloomsbury, by the museum. Bring your guitar and your ears.`},{id:`m_kw1`,from:`Kwame`,when:{day:2,hour:9},text:`boiler is sulking again. also the parrot said a new word. not ideal.`},{id:`m_priya`,from:`Priya`,when:{day:3,hour:14,phase:2},clue:`a1`,text:`soph. Em's residency posted a group photo and she's NOT IN IT. em is always in the group photo. always. suspicious 👀`},{id:`m_em2`,from:`Emma`,when:{day:4,hour:12,phase:2},text:`sorry, crazy week! what's your favourite thing about London so far?`,replies:[{text:`The music. It's everywhere.`,answer:`of course it's the music 🎸 never change`,mood:4},{text:`Custard tarts. Specifically one café's.`,answer:`oh? which café?? (asking for no reason)`,mood:5},{text:`Honestly? Missing you.`,answer:`don't. I'll cry on the subway. (the subway. in new york. where I am.)`,mood:8}]},{id:`m_mum2`,from:`Mum`,when:{phase:3},text:`Your sister has gone very quiet and very cheerful at the same time. I know that combination. x`},{id:`m_express`,from:`Kwame`,when:{deduction:`where`},text:`tip: use the fast lines, you're a proper Londoner now. (fast travel time halved)`,perk:`express`},{id:`m_em3`,from:`Emma`,when:{deductions:[`stay`,`routine`]},clue:`d2`,text:`You found me in New York. Now find me here. Dad's favourite song was about a sunset and a bridge. 🌅`}],tutorial:[{id:`talk_dev`,text:`Say hi to your flatmate Kwame`,npc:`kwame`},{id:`eat`,text:`Get something to eat`},{id:`metro`,text:`Take the Tube (find a Ⓜ station)`},{id:`work`,text:`Visit the Hale Institute in Bloomsbury`},{id:`sleep`,text:`Head home and sleep when it's late`}],work:{poi:`institute`,label:`Internship`,sessions:{session:{name:`Ear-training session`,hours:3,pay:45,length:4,text:`Imogen plays a phrase on the piano. Play it back.`},practice:{name:`Practice room`,hours:2,pay:0,length:5,text:`You run your set in a soundproofed box that smells of old carpet. Nail the riff.`},gig:{name:`Riverside Hall gig`,hours:3,pay:120,length:6,needSessions:3,perk:`venue`,text:`Lights down. Rafi gives you a thumbs up. Play the melody as the crowd hushes.`}}},pursuit:{intro:[`Your phone buzzes. A photo: Camden Lock, and on the gate, a paper lantern.`,`Emma: "Your turn to run, Soph. Sunset's at 7:45. 🏮"`],steps:[{district:`camden`,at:[-36,-14],name:`Camden Lock`,seconds:200,note:[`Callum is sitting on the lock gate, holding a paper lantern and grinning.`,`"She said you'd come. She said: 'noon, the room with the glass sky'." He winks. "Go on. I'll want the ending."`]},{district:`bloomsbury`,at:[0,-34],name:`The British Museum`,seconds:200,note:[`Felix waits on the museum steps with a sketchbook.`,`Every page is a paper lantern. The last one is a bridge, the sun going down behind it, two girls on the railing. "Dad's song," he reads. "She said you'd know."`]},{district:`southbank`,at:[40,-92],name:`Waterloo Bridge`,seconds:240,final:!0}]},reunion:{district:`southbank`,at:[40,-11
